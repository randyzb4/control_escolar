{% extends 'horarios/base.html' %}

{% block title %}Gestión de subgrupos{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="bi bi-people-fill"></i> Gestión de subgrupos</h2>
    <a href="{% url 'horarios:dashboard' %}" class="btn btn-outline-secondary">
        <i class="bi bi-arrow-left"></i> Volver
    </a>
</div>

<div class="alert alert-info">
    <i class="bi bi-info-circle"></i>
    Selecciona un grupo para gestionar los subgrupos de sus materias paralelas.
</div>

<div class="card">
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Grupo</label>
                <select name="grupo" class="form-select" required>
                    <option value="">Selecciona un grupo</option>
                    {% for g in grupos %}
                        <option value="{{ g.id }}">{{ g.nombre }}</option>
                    {% endfor %}
                </select>
            </div>
            <button type="submit" class="btn btn-primary">
                <i class="bi bi-arrow-right"></i> Continuar
            </button>
        </form>
    </div>
</div>
{% endblock %}
